name: Public docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  content-firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: notiky/notiky
          path: notiky-app
          sparse-checkout: server/internal/daemon
          sparse-checkout-cone-mode: true
      - name: Public docs firewall
        run: bash scripts/check-public-docs.sh
      - name: Docs accuracy verification
        run: bash scripts/verify-docs-accuracy.sh
        env:
          NOTIKY_APP_ROOT: ${{ github.workspace }}/notiky-app
